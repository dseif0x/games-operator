name: release-images

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: build and push ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: games-operator
            file: docker/hub.Dockerfile
          - name: games-operator-bridge
            file: docker/bridge.Dockerfile
    outputs:
      digest-games-operator: ${{ steps.digest.outputs.games-operator }}
      digest-games-operator-bridge: ${{ steps.digest.outputs.games-operator-bridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfiles compile with --mount=type=cache for Go's module and
      # build caches. The layer cache (type=gha below) does not contain those
      # mounts, so without this every run recompiles everything for both
      # architectures. cache-dance persists the mount contents through
      # actions/cache: injected before the build, extracted after it.
      - id: gocache
        uses: actions/cache@v4
        with:
          path: |
            go-build-cache
            go-mod-cache
          key: go-docker-${{ matrix.name }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-docker-${{ matrix.name }}-${{ hashFiles('go.sum') }}-
            go-docker-${{ matrix.name }}-
      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: |
            {
              "go-build-cache": "/root/.cache/go-build",
              "go-mod-cache": "/go/pkg/mod"
            }
          skip-extraction: ${{ steps.gocache.outputs.cache-hit }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            VERSION=${{ github.ref_name }}
      - id: digest
        run: echo "${{ matrix.name }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  release:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: release notes
        run: |
          {
            echo "## Images"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/games-operator@${{ needs.build.outputs.digest-games-operator }}"
            echo "ghcr.io/${{ github.repository_owner }}/games-operator-bridge@${{ needs.build.outputs.digest-games-operator-bridge }}"
            echo '```'
            echo
            echo "## Chart"
            echo
            echo "The Helm chart \`games-operator-${GITHUB_REF_NAME#v}\` is published by the release-chart workflow to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          } > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          generate_release_notes: true
