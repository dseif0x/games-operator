{{- if .Values.devices.enabled }}
# The device plugin: on every game node it writes the CDI spec for Wolf's
# virtual input devices and hands it to app pods, so they open those
# devices without running privileged (docs/OPERATIONS.md, Input devices).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "games-operator.fullname" . }}-devices
  labels:
    {{- include "games-operator.devicesLabels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "games-operator.devicesSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "games-operator.devicesSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.devices.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.devices.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      priorityClassName: system-node-critical
      {{- if or .Values.devices.modprobe .Values.devices.sysctls }}
      hostPID: true
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: devices
          image: "{{ .Values.devices.image.repository }}:{{ .Values.devices.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apps.pullPolicy }}
          env:
            - name: DEVICES_CDI_DIR
              value: /var/run/cdi
            - name: DEVICES_SOCKET_DIR
              value: /var/lib/kubelet/device-plugins
            - name: DEVICES_COUNT
              value: {{ .Values.devices.count | quote }}
            - name: DEVICES_SECCOMP_DIR
              value: /seccomp/games-operator
            - name: DEVICES_HOST_NODES
              value: /host-nodes
            - name: DEVICES_HOST_NODES_HOSTPATH
              value: {{ .Values.devices.hostNodesDir | quote }}
            {{- if .Values.devices.openRenderNodes }}
            - name: DEVICES_DRI_DIR
              value: /host-dri
            {{- end }}
            {{- if .Values.devices.modprobe }}
            - name: DEVICES_MODPROBE
              value: {{ join "," .Values.devices.modprobe | quote }}
            {{- end }}
            {{- if .Values.devices.sysctls }}
            - name: DEVICES_SYSCTL
              value: {{ join "," .Values.devices.sysctls | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.devices.resources | nindent 12 }}
          securityContext:
            {{- if or .Values.devices.modprobe .Values.devices.sysctls }}
            # modprobe and sysctl through the host's namespaces (nsenter).
            privileged: true
            {{- else }}
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            {{- end }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: cdi
              mountPath: /var/run/cdi
            - name: seccomp
              mountPath: /seccomp
            - name: host-nodes
              mountPath: /host-nodes
            {{- if .Values.devices.openRenderNodes }}
            - name: dri
              mountPath: /host-dri
            {{- end }}
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
        - name: seccomp
          hostPath:
            path: {{ .Values.devices.seccompRoot }}
            type: DirectoryOrCreate
        - name: host-nodes
          hostPath:
            path: {{ .Values.devices.hostNodesDir }}
            type: DirectoryOrCreate
        {{- if .Values.devices.openRenderNodes }}
        - name: dri
          hostPath:
            path: /dev/dri
            type: DirectoryOrCreate
        {{- end }}
{{- end }}
