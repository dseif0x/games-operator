{{- if and .Values.browser.enabled .Values.browser.networkPolicy.enabled }}
# The embedded player holds every user's Moonlight identity. It is reached
# by the hub's proxy only, and it reaches DNS, the hub (the Moonlight door
# and, through the ingress controller, the Wolf-compatible API), the game
# pods (the streams) and addresses outside the cluster: not the database,
# not other pods. The LoadBalancer addresses it dials are translated to
# pod addresses inside the cluster, which is why the hub and the game pods
# are allowed by label rather than by address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "games-operator.fullname" . }}-moonlight-web
  labels:
    {{- include "games-operator.browserLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "games-operator.browserSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "games-operator.selectorLabels" . | nindent 14 }}
      ports:
        - { port: {{ .Values.browser.httpsPort }}, protocol: TCP }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.apps.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - podSelector:
            matchLabels:
              {{- include "games-operator.selectorLabels" . | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: games-operator-app
              app.kubernetes.io/managed-by: games-operator
        {{- with .Values.browser.networkPolicy.ingressController }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
        {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.apps.networkPolicy.clusterCIDRs | nindent 14 }}
{{- end }}
