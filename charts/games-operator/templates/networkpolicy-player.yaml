{{- if and .Values.browser.enabled .Values.browser.networkPolicy.enabled }}
# The embedded player holds every user's Moonlight identity and talks to
# the hub's Wolf-compatible API and to the Moonlight door, both on the
# LAN side. It is reached by the hub's proxy only, and it reaches DNS and
# addresses outside the cluster only: not the database, not other pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "games-operator.fullname" . }}-moonlight-web
  labels:
    {{- include "games-operator.browserLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "games-operator.browserSelectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "games-operator.selectorLabels" . | nindent 14 }}
      ports:
        - { port: {{ .Values.browser.httpsPort }}, protocol: TCP }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.apps.networkPolicy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.apps.networkPolicy.dns.podLabels | nindent 14 }}
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml .Values.apps.networkPolicy.clusterCIDRs | nindent 14 }}
{{- end }}
