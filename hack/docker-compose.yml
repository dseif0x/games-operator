services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: games_operator
      POSTGRES_PASSWORD: games_operator
      POSTGRES_DB: games_operator
    ports:
      - "5433:5432"
    volumes:
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games_operator"]
      interval: 2s
      timeout: 2s
      retries: 20
